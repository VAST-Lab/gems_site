<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Convert | GemScan</title>
  <link rel="icon" type="image/x-icon" href="../../public/assets/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../public/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../public/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../public/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="../../public/assets/icons/site.webmanifest">
  <meta name="description" content="A curated library of 3D models and Gaussian Splats.">
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>

<body>
  <div class="shell">
    <div class="content convert-page">
      <main class="wrap">
        <div class="convert-grid">
          <section class="convert-card">
            <h3>Input Files</h3>
            <div id="drop" class="dropzone" tabindex="0" role="button" aria-label="Upload model">
              <div class="drop-icon">⬆</div>
              <div class="drop-title">Drag & drop model files here</div>
              <div class="muted">or click to browse</div>
              <div class="drop-types muted">.glb, .gltf</div>
              <input id="file" class="file" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" />
            </div>
            <div id="inputInfo" class="muted" style="margin-top:10px;"></div>
          </section>
          <section class="convert-card">
            <h3>Output</h3>
            <label class="field">
              <div class="field-label">Format</div>
              <select id="format" class="select">
                <option value="glb">.glb (binary)</option>
                <option value="gltf">.gltf (JSON + .bin)</option>
              </select>
            </label>
            <label class="field">
              <div class="field-label">Filename</div>
              <input id="filename" class="input" value="output" />
            </label>
            <div class="muted" style="margin-top:10px;">OUTPUT ACTIONS</div>
            <div class="muted" style="margin-top:6px;">Applied to the result before export</div>
            <div class="muted" style="margin:10px 0 10px;">No actions added</div>
            <button id="addAction" class="btn btn-ghost">＋ Add Action</button>
            <button id="convert" class="btn btn-primary" style="margin-top:12px;" disabled>Convert & Download</button>
            <div id="status" class="muted" style="margin-top:10px;"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js"
  }
}
</script>
  <script type="module">
    import { initSidebar } from '../components/sidebar.js';
    import { initTopbar } from '../components/topbar.js';
    initSidebar();
    initTopbar();
  </script>
  <script type="module" src="/src/js/model.js"></script>
</body>

</html>
