<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Search Minerals | GemScan</title>
  <link rel="icon" type="image/x-icon" href="../../public/assets/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../public/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../public/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../public/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="../../public/assets/icons/site.webmanifest">
  <meta name="description" content="Advanced mineral search page for GemScan Library.">
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
  <div class="shell">
    <div class="content search-page">
      <main class="search-wrap">
        <section class="search-hero">
          <div class="search-kicker">Advanced Search</div>
          <h1 class="search-title">Search Minerals</h1>
          <p class="search-intro">
            Narrow results by specimen details, description, locality, collection data, price range, and catalog
            metadata.
          </p>
        </section>
        <section class="search-panel">
          <div class="search-panel-head">
            <h2 class="search-panel-title">Advanced Search Form</h2>
            <div class="search-panel-note">Expand your filters to find a specific specimen faster.</div>
          </div>
          <form class="search-form" action="index.html" method="get">
            <div class="search-grid">
              <div class="field field-full">
                <label for="query">Search Query</label>
                <input type="search" id="query" name="q" placeholder="Search..." aria-label="Search query">
              </div>
              <div class="field">
                <label for="species">Species</label>
                <select id="species" name="species">
                  <option value="">Select a Species</option>
                  <option>Quartz</option>
                  <option>Calcite</option>
                  <option>Fluorite</option>
                  <option>Tourmaline</option>
                  <option>Beryl</option>
                </select>
              </div>
              <div class="field">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" placeholder="Description">
              </div>
              <div class="field">
                <label for="mineralName">Mineral Name/Varietal</label>
                <input type="text" id="mineralName" name="mineralName" placeholder="Mineral Name/Varietal">
              </div>
              <div class="field">
                <label for="locality">Locality</label>
                <input type="text" id="locality" name="locality" placeholder="Locality">
              </div>
              <div class="field">
                <label for="specimenNo">Specimen No.</label>
                <input type="text" id="specimenNo" name="specimenNo" placeholder="Specimen No.">
              </div>
              <div class="field">
                <label for="addedSince">Added</label>
                <div class="field-row-2">
                  <select id="addedSince" name="addedType">
                    <option value="since">Since</option>
                    <option value="before">Before</option>
                    <option value="on">On</option>
                    <option value="between">Between</option>
                  </select>
                  <input type="date" id="addedDate" name="addedDate">
                </div>
              </div>
            </div>
            <div class="search-divider"></div>
            <div class="search-grid">
              <div class="field">
                <label for="minPrice">Min Price</label>
                <div class="money-row">
                  <div class="money-prefix">$</div>
                  <input type="number" id="minPrice" name="minPrice" placeholder="Min Price" min="0" step="0.01">
                </div>
              </div>
              <div class="field">
                <label for="maxPrice">Max Price</label>
                <div class="money-row">
                  <div class="money-prefix">$</div>
                  <input type="number" id="maxPrice" name="maxPrice" placeholder="Max Price" min="0" step="0.01">
                </div>
              </div>
              <div class="field">
                <label for="collection">Collection</label>
                <select id="collection" name="collection">
                  <option value="">Collection</option>
                  <option>GemScans Archive</option>
                  <option>Featured Specimens</option>
                  <option>Private Collection</option>
                  <option>Research Collection</option>
                </select>
              </div>
              <div class="field">
                <label for="size">Size</label>
                <select id="size" name="size">
                  <option value="">Size</option>
                  <option>Small</option>
                  <option>Medium</option>
                  <option>Large</option>
                  <option>Museum</option>
                </select>
              </div>
            </div>
            <div class="search-actions">
              <div class="search-actions-left">
                <button class="search-btn search-btn-primary" type="submit">Search</button>
                <button class="search-btn search-btn-secondary" type="reset">Clear</button>
              </div>
              <div class="search-actions-right">
                <a class="search-help" href="#">Help</a>
                <a class="search-help" href="#">Size Specs</a>
              </div>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>
  <script type="module">
    import { initSidebar } from '../components/sidebar.js';
    import { initTopbar } from '../components/topbar.js';
    initSidebar();
    initTopbar();
  </script>
</body>

</html>
