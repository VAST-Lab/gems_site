<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GemScan Library</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/icons/favicon.ico">
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>

<body>
  <div class="shell">
    <div class="content">
      <header class="topbar">
        <div class="topbar-left">
          <img src="/public/assets/img/GemScan.logo.png" class="header-logo" alt="GEMSCANS" />
        </div>
        <div class="topbar-right">
          <input id="search" class="search" placeholder="Search models, tags, author…" autocomplete="off" />
        </div>
      </header>
      <main class="wrap">
        <section class="filters">
          <div class="filters-row">
            <div class="filters-title">Tags</div>
            <div id="tagChips" class="chips" aria-label="Tag filters"></div>
          </div>
          <div class="filters-row">
            <div class="filters-title">Results</div>
            <div id="count" class="muted"></div>
          </div>
        </section>
        <section id="grid" class="grid" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.178/build/three.module.js"
  }
}
</script>
  <script type="module">
    import { initSidebar } from '../components/sidebar.js';
    initSidebar();
  </script>
  <script type="module" src="/src/js/model.js"></script>
</body>

</html>
